services:
  python:
    build:
      context: .
      dockerfile: .devcontainer/python/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - POSTGRES_HOST: db
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env